[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-endorsement-rag"
version = "0.1.0"
description = "Ask-my-documents RAG over insurance endorsement packs, with page-level citations."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises the live Claude API; requires ANTHROPIC_API_KEY",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]
